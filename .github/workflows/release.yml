name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build liblinuwux.so stamped with the tag version
        run: |
          LINUWUX_VERSION_OVERRIDE="${GITHUB_REF_NAME#v}" ./build.sh
          cp src/linuwux.sh dist/linuwux.sh

      - name: Generate checksums
        working-directory: dist
        run: sha256sum liblinuwux.so linuwux.sh > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/liblinuwux.so
            dist/linuwux.sh
            dist/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Install

            ```
            curl -fsSL https://raw.githubusercontent.com/brcly/proton-LinUwUx-patch/main/install.sh | sh
            ```

            Downloads `liblinuwux.so` and the `linuwux` wrapper from this release into `~/.local/lib` / `~/.local/bin`, verifies the checksum, done. No `git clone`, no compiler.

            Steam launch option:

            ```
            ~/.local/bin/linuwux %command%
            ```
